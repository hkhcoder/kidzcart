server {
    listen 80;
    server_name _;

    # Where the built Angular files live (copied in Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # REVERSE PROXY RULES
    #
    # The Angular app calls /api/... for all backend requests.
    # Nginx strips the /api prefix and forwards to the right service.
    #
    # "location /api/xyz" means: match any URL that starts with /api/xyz
    # "proxy_pass" means: forward the request to this backend container
    # "rewrite" means: remove the /api prefix before forwarding
    #
    # Example:
    #   Browser sends:   POST /api/auth/signup
    #   Nginx forwards:  POST /auth/signup  →  marketplace:4001
    # ------------------------------------------------------------------

    # Auth, users, orders, coupons → Java Spring Boot service
    location /api/auth {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://marketplace:4001;
    }

    location /api/users {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://marketplace:4001;
    }

    location /api/orders {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://marketplace:4001;
    }

    location /api/coupon {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://marketplace:4001;
    }

    # Products, donations, notifications → Node.js service
    location /api/products {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://product:4002;
    }

    location /api/donations {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://product:4002;
    }

    location /api/notifications {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://product:4002;
    }

    location /api/health {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://product:4002;
    }

    # Achievements → .NET service
    location /api/achievements {
        rewrite ^/api(.*)$ $1 break;
        proxy_pass http://achievement:4006;
    }

    # ------------------------------------------------------------------
    # ANGULAR SPA FALLBACK
    #
    # For any URL that is NOT an /api route (e.g. /home, /cart, /auth),
    # serve index.html and let Angular's router handle it.
    #
    # try_files checks:
    #   1. Does the exact file exist?  → serve it
    #   2. Does a folder with that name exist? → serve its index
    #   3. Otherwise → serve /index.html (Angular takes over)
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
